# Generated by `wsc ci render` from ci/policy.yml.in: do not edit this file; edit the template or [ci] in wsc.toml.
# purpose: CI's `policy` check on every pull request: the branch kind decides what it may change (D21, `wsc policy`); a failure comments on the pull request (J42).
# usage: runs on GitHub Actions; locally: python3 core/wsc.py policy --branch <branch> --base origin/main
# when: automatic on pull requests; require the "policy" check in branch protection for main.
# not-a-verb: GitHub runs workflows by file; this one only calls `wsc policy`.
# Its own workflow so that gates.yml can run once per commit on push (J42): this one is cheap and needs the pull request's base and head.
# Draft pull requests skip it (J54): a job's builder opens its pull request as a draft when the job reaches review, so the review sees
# the branch's CI (the push-run checks attach to the commit and `wsc ci notify` comments on a red one) without a `policy` that must fail
# until the review says merge. The reviewer's `gh pr ready` (a merge verdict only, docs/REVIEW.md) sends ready_for_review, which runs it.
# J57: the reviewer marks the pull request ready BEFORE pushing the review commit (a skipped policy counts as passed, and `gh pr merge --auto`
# merges at once when the checks have passed), so the pushed head gets a real `policy` run. The ready_for_review run on the old head has no
# merge verdict and is red by design: the push cancels it (concurrency below), and `notify` stays silent for it.
name: policy
# Core W23 (0.26.0): pull_request_target, so GitHub runs main's copy of this workflow and a branch cannot edit its own check. The pull_request
# trigger is the bootstrap for J64's own pull request (main's copy has no pull_request_target yet); remove it in the next change to this template.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['jobs/J64/report.md']
permissions:
  contents: read
concurrency:
  group: policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  policy:
    # Every pull request must be a reviewed job, a brief, a planning change or an infrastructure change (`wsc policy`), judged with
    # the base's rules (W23). This job runs with the base's privileges: no step checks out, builds, caches or runs the pull request's
    # files; its head is fetched as git objects for `wsc policy` to read, and the head's names reach scripts through env only.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.WARSCAPE_CORE_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - env:
          PR: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pull/$PR/head"
      # rule 79 compares the core pins at the merge base and the head (J58). The checkout is the base (core W23: pull_request_target), so HEAD
      # is the base: the head's sha comes from env, never from an expression inside run. Both pins are fetched into core/ when missing; a pin
      # that still cannot be fetched is left to the policy module, which counts the pin change and says why (fail closed).
      - env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          for rev in "$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")" "$HEAD_SHA"; do
            pin=$(git rev-parse "$rev:core")
            git -C core cat-file -e "$pin^{commit}" 2>/dev/null || git -C core fetch --no-tags origin "$pin" || echo "could not fetch core pin $pin"
          done
      - env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python core/wsc.py policy --branch "$HEAD_REF" --base "origin/$BASE_REF" --head "$HEAD_SHA"
  notify:
    needs: [policy]
    if: failure() && github.event.action != 'ready_for_review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          token: ${{ secrets.WARSCAPE_CORE_TOKEN }}
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: python3 core/wsc.py ci notify --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --branch "$BRANCH" --repo "$GITHUB_REPOSITORY"
