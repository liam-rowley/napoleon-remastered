# purpose: CI on every push and pull request: the full warscape-core `wsc gates` set, and the proxy DLL build, host tests and wine smoke test (job proxy).
# usage: runs on GitHub Actions; locally: python3 core/wsc.py gates
# when: automatic; require the "gates" check in branch protection for main.
# not-a-verb: GitHub runs workflows by file; this one only calls `wsc gates`.
# The core is a private submodule: WARSCAPE_CORE_TOKEN (fine-grained, Contents read on warscape-core and this repo) lets checkout fetch it.
name: gates
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          token: ${{ secrets.WARSCAPE_CORE_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python core/wsc.py gates
  # proxy: build the proxy d3d9.dll with the release route (mingw-w64 i686 on Ubuntu 24.04, the same toolchain as the cloud
  # container: proxy/README.md "Build") and run its host tests; the DLL is kept as a workflow artifact.
  proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # full history: the build id is the last commit touching the DLL inputs (build.sh); a shallow clone sees only HEAD, so every
      # push would get a new build id and new DLL bytes, and the CI DLL would stop matching the PC-tested one (J1 run 40775169543).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: the checkout has full history (the build id depends on it)
        run: test "$(git rev-parse --is-shallow-repository)" = false
      - run: sudo apt-get update -q && sudo apt-get install -y -q g++-mingw-w64-i686
      - run: proxy/tools/build.sh all
      - name: the DLL is byte-identical when built from another checkout path
        run: proxy/tools/build.sh repro
      - name: smoke test the DLL under wine (a stand-in exe loads it; guard verdicts, config, log, clean detach)
        run: |
          sudo dpkg --add-architecture i386 && sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends wine wine32:i386
          proxy/tools/build.sh smoke
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-d3d9-napoleon
          path: build/proxy/napoleon/d3d9.dll
          if-no-files-found: error

  # harness-windows: the J2 watcher, lock, profiles, hang watchdog, updater and installer on GitHub's Windows runner under
  # Windows PowerShell 5.1 (shell: powershell), the same PowerShell the PC runs. Fake games are compiled on the runner.
  harness-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: PowerShell version
        shell: powershell
        run: $PSVersionTable.PSVersion.ToString()
      - name: harness host tests (unit and integration)
        # shorter than the job timeout: a hung test fails the step and the job still ends, so its log is kept
        timeout-minutes: 18
        shell: powershell
        run: ./harness/tests/Run-HostTests.ps1 -Suite all

  policy:
    # Every pull request must be a reviewed job, a brief, a planning change or an infrastructure change (D21, tools/pr_policy.py).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tools/pr_policy.py --branch "${{ github.head_ref }}" --base "origin/${{ github.base_ref }}"
