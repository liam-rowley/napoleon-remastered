<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewer Spike J31</title>
<style>
  :root { --bg: #f4f1ea; --fg: #1f1d1a; --muted: #6b665c; --line: #d8d2c4; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #16181c; --fg: #e8e4da; --muted: #9a958a; --line: #2c3038; } }
  :root[data-theme="dark"] { --bg: #16181c; --fg: #e8e4da; --muted: #9a958a; --line: #2c3038; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p.note { margin: 0 0 12px; color: var(--muted); }
  #picker { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 12px; }
  #picker input { width: 72px; background: transparent; color: var(--fg); border: 1px solid var(--line); padding: 2px 4px; }
  #canvas { display: block; max-width: 100%; border: 1px solid var(--line); background: #000; }
  #status { margin-top: 12px; color: var(--muted); font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Review viewer spike (J31): hello world</h1>
<p class="note">RmlUi 6.3 + FreeType + Lua 5.1.1 (float32) in WebAssembly. Test screen only: not a design.</p>
<form id="picker" onsubmit="return false">
  <label>width <input id="pk_w" type="number" min="320" max="7680"></label>
  <label>height <input id="pk_h" type="number" min="240" max="4320"></label>
  <label>slider % <input id="pk_slider" type="number" min="85" max="125" step="5"></label>
  <label>ratio (overrides) <input id="pk_ratio" type="number" step="0.05" min="0"></label>
  <span id="pk_out"></span>
</form>
<canvas id="canvas" width="1280" height="720"></canvas>
<div id="status"></div>
<script src="viewer.js"></script>
<script src="viewer_host.js"></script>
</body>
</html>
