; napoleon_remastered.ini - Napoleon: Total War Remastered proxy settings. GENERATED from registries/config_keys.jsonl
; (proxy/tools/gen_tables.py): every key the proxy reads, at its release value. Unknown keys are logged and ignored.

[controls]
; the core's gesture layer (core W6, 0.13.0; core docs/PROXY_GESTURES.md): drag the selection onto a drawn line, rotate in place, a footprint preview, the orders on release; needs a GestureAdapter, which Napoleon does not have yet (proxy/napoleon/adapter.cpp passes gesture = nullptr; J29 fills it), so the layer logs the no-adapter line and stays inert; off = the layer passes every message (default 0)
gestures=0

[dev]
; drive the engine from the front end to a target at start-up through its own Lua: frontend | campaign:new:<campaign>:<faction> | campaign:continue | campaign:<save> | battle:<preset>; empty = off (default )
autostart=
; settle time between the first front-end Lua pump and the config autostart (default 1500)
autostart_delay_ms=1500
; battle camera setter (J43): wsp.cam_set(x, y, z, yaw, pitch) in the dev Lua bridge calls the active camera mode's own SetTargetAndPosition on the engine thread (engine_sites battle.camera_*); ctl.py cam reads the pose back with probes/cam_read.lua (default 0)
camera=0
; frame capture (J8): ctl capture <name> [frames] records every device call of the next 1-8 frames to <dev.capture_dir>\<name>\frame.txt and each shader's bytecode once per hash; with 0 nothing is hooked (proxy/README.md Frame capture) (default 0)
capture=0
; the frame capture's folder, outside the game folder (D25) so the uninstall stays byte-exact; empty refuses ctl capture (default C:\napoleon_remastered_pc\captures)
capture_dir=C:\napoleon_remastered_pc\captures
; campaign console (J15): fill the executor's empty external-handler slot with a forwarder to the campaign CLI (built with the exe's own ctor on the live campaign context), and the ctl verb console <line>|status|on|off; off = nothing read or written in engine memory and console lines refused (default 0)
console=0
; control channel: requests <dev.ctl_dir>\<id>.cmd, results <id>.done (ping, state, log, lua, waitfor, autostart, reset, exit; proxy/README.md) (default 0)
ctl=0
; the control channel's folder, outside the game folder (D25) so the uninstall stays byte-exact (default C:\napoleon_remastered_pc\ctl)
ctl_dir=C:\napoleon_remastered_pc\ctl
; file-redirection rule file (relative to the game folder or absolute): redirect / fail / add / movie-fail / movie-redirect lines, proxy/core/filerules.h; empty = none (default )
file_rules=
; file-open survey: every distinct path the exe opens, checks or lists (CreateFile, GetFileAttributes, FindFirstFile) into napoleon_remastered\logs\files.log, and every movie open in proxy.log (default 0)
log_files=0
; the engine's Lua loads the proxy (wrapper scripts served by a virtual pack, wsp table: poll, result, dev_config, report, vanilla); needed for scenes from Lua, lua commands, autostart and reset (default 0)
lua_bridge=0
; battle unit orders (J28): wsp.unit_state, unit_list, selection, order_move and peek in the dev Lua bridge read live unit state and the UI selection and push move and face orders through the engine command path on the engine thread (engine_sites battle.*, config_key dev.orders); ctl.py order checks every order by readback (default 0)
orders=0
; ctl perf <seconds>: records the time between presents (p50, p99, max, frame count) and reports process memory (address space, commit, working set) (default 0)
perf=0
; refuse the start-up movies at BinkOpen (the adapter's list; the engine treats a refused movie as finished); the front-end background is untouched (default 0)
skip_intro=0
; napoleon_remastered\state.json rewritten atomically about twice a second: launch id, frame, scene, Lua context, battle probe, memory, Lua reports (default 0)
state_json=0
; phase timeline: one UTC millisecond timeline per launch in proxy.log and napoleon_remastered\logs\timeline.json (process start, DllMain, Direct3DCreate9, device, first Present, every movie, front-end pump, autostart, loading, scene ready, exit) (default 0)
timeline=0

[gfx]
; J9 proof of the grass grid sites (engine_sites grass.*): grid N 5 -> 9 at gfx_grass_quality 3 and 4 (range 80 -> 144 m); J27 replaces it with a configured value (default 0)
grass_proof=0
; shadow crop kept when a caster is behind the warp eye (engine_sites shadow.fit_crop_keep): flag +0x66 1 -> 0 (default 0)
shadow_crop_keep=0
; shadow extrusion length (engine_sites shadow.light_sweep): -75 -> -150 m; casters further towards the sun are gathered (default 0)
shadow_extrusion=1
; shadow far clip at gfx_shadow_quality 3 (engine_sites shadow.far_cap_q3): 500 -> 1000 m; a longer fitted farz, fewer texels per metre (default 0)
shadow_far_cap=0
; shadow fit without the trapezoidal warp (engine_sites shadow.fit_warp_ortho): shadow_map_mode 1 -> 0 (default 0)
shadow_fit_ortho=0
; shadow trapezoid focus distance (engine_sites shadow.fit_focus): 0.7 -> 0.3 (default 0)
shadow_focus=0
; shadow far distance height cutoff (engine_sites shadow.fit_height_cutoff): 100 -> 200 m; a low camera fits a shorter farz (default 0)
shadow_height_cutoff=1
; diagnostic: the NVIDIA/ATI hardware shadow path forced with gfx_hardware_shadows off (engine_sites shadow.hw_force_setup, shadow.hw_force_define); the caps still decide (default 0)
shadow_hw_force=0
; shadow map edge at gfx_shadow_quality 3 and 4 (engine_sites shadow.map_size_q34): 2048 -> 8192 (quality 4 is R32F: twice the memory) (default 0)
shadow_map_large=1
; shadow near trapezoid scale (engine_sites shadow.fit_near_scale): 1.0 -> 0.5 (default 0)
shadow_near_scale=0
; J9 proof of the ship LOD sites (engine_sites ship_lod.*): rope 1000 (fade from 900) and knot 400 m (stock 200/150, 50); J27 replaces it with configured distances; MAST_LOD_DISTANCE showed no effect and has no row (fact napoleon.lod.mast) (default 0)
ship_lod_proof=0
; J9 proof of the unit imposter page sites (engine_sites sprite.page_q*): page edge 2048 on every switch case (stock 512 / 1024); costs battle load time; J27 replaces it with a configured value (default 0)
sprite_page_proof=0
; J9 proof of the tree distance sites (engine_sites trees.*): tree far distance 600 m on every gfx_tree_quality case (stock 100 / 150 / 200, 50 for 0 and 4); J27 replaces it with configured distances (default 0)
tree_lod_proof=0
; J9 proof of the unit LOD sites (engine_sites unit_lod.*): ENTITY_LOD_OVERRIDE on with IMPOSTER_DISTANCE and LARGE_IMPOSTER_DISTANCE 1000 m, so units stay meshes far out; J27 replaces it with configured distances (default 0)
unit_lod_proof=0

[headless]
; J13: the target display is the one non-primary display whose adapter or monitor string contains this (case-insensitive); never an index or a DISPLAYn name (default Virtual Display Driver)
display_name=Virtual Display Driver
; J13: put every game window on the virtual display and never on a real monitor (fail closed: no target, a wrong size or a fullscreen device = hide everything, write napoleon_remastered\headless_status.json, exit 2160); the watcher turns it on for every launch but visible=1 ones (default 0)
enabled=0
; J13: after a topology change with no target found, keep retrying (cloaked) this long before refusing (default 5000)
refuse_grace_ms=5000
; J13: after a display-topology change the window stays cloaked until the layout has been quiet this long on the re-resolved target (default 500)
settle_ms=500
; J13: the wanted back buffer and the exact size the target display must have, WxH (the watcher sets it with x_res/y_res) (default 3840x2160)
size=3840x2160
; J12 PC test hook: this many ms after start-up the proxy shows a 640x480 window at the primary's origin from its own thread and import, as a DLL's dialog would appear; the window sweep must hide it (proves fix 1b); 0 = off, dev only (default 0)
test_dll_window_ms=0
; J12 PC test hook: relocations run on the guard thread, which does not own the game window, so the guard's move is asynchronous as in a game that presents from a worker thread (proves fix 1a); dev only (default 0)
test_off_thread=0

[proxy]
; d3d9 implementation the exports forward to: dxvk (stock DXVK, pinned by proxy/tools/fetch_dxvk.py) or system (the Windows d3d9); a missing DXVK falls back to system with a warning (default dxvk)
backend=dxvk
; DXVK d3d9 DLL, relative to the game folder or absolute; DXVK log, config and caches are redirected next to it (never the game folder) (default napoleon_remastered\dxvk\d3d9_dxvk.dll)
dxvk_path=napoleon_remastered\dxvk\d3d9_dxvk.dll
; 0 = pure pass-through: the backend only (no exe guard, no crash capture, no patches); for isolating a problem to the proxy (default 1)
enabled=1
; exe-identity guard: 1 = an exe that is not the pinned build runs as plain pass-through; 0 = developer override, engine features on whatever the exe (warned at every start) (default 1)
exe_guard=1
; test key: 1 = take the pass-through path on a matching exe (notice file and log as for a real mismatch); wins over exe_guard=0 (default 0)
exe_guard_force_mismatch=0
; lowest level written to napoleon_remastered\logs\proxy.log: debug, info, warn or error (default info)
log_level=info
; in-process minidump into napoleon_remastered\dumps: 0 off, 1 unhandled exceptions only, 2 also the first fatal first-chance exception (when the game replaces the top-level filter); WER LocalDumps is the out-of-process backstop; release value 2 because the game replaces the top-level filter after DllMain (fact napoleon.crash.toplevel_filter_replaced, J3) (default 2)
minidump=2
; runtime patch engine: apply the engine_sites patches in memory once the exe guard accepts the exe (all-or-nothing); 0 = check and log only (default 1)
runtime_patches=1

[ui]
; the RmlUi host's folder, relative to the game folder: documents (ctl ui show <path under it>) and fonts\*.ttf; installed by pc_deploy.py from the kit's ui files (default napoleon_remastered\ui)
dir=napoleon_remastered\ui
; where ctl ui dump writes lossless PNGs of the back buffer, outside the game folder (D25) so the uninstall stays byte-exact (default C:\napoleon_remastered_pc\ui_dumps)
dump_dir=C:\napoleon_remastered_pc\ui_dumps
; the RmlUi host (J30): RmlUi drawn from the Present chain on the main device, input routing, ctl ui; with 0 nothing is hooked, loaded or allocated (proxy/README.md "RmlUi host"; J35 turns it on with the first screen) (default 0)
enabled=0
; UI scale slider in percent (D19): dp ratio = back-buffer height / 1080 x ui.scale / 100; 85-125 in steps of 5, out of range or off the grid clamped and logged (default 100)
scale=100
; dev: a document under ui.dir shown once the main device is ready (J30 host test: hosttest/hosttest.rml); empty shows nothing (default )
show=
